name: Hooshkav - Daily Digest

on:
  schedule:
    # 08:00 Iran winter (IRST=UTC+3:30) | 09:00 Iran summer (IRDT=UTC+4:30)
    - cron: "30 4 * * *"

  workflow_dispatch:

  repository_dispatch:
    types: [telegram_on_demand, generate_digest]

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALLOWED_TELEGRAM_USER: ${{ secrets.ALLOWED_TELEGRAM_USER }}
        run: python main.py digest
